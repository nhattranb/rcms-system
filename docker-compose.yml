version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rcms_postgres
    restart: always
    environment:
      POSTGRES_USER: rcms_user
      POSTGRES_PASSWORD: rcms_password
      POSTGRES_DB: rcms_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
